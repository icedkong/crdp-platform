# E22-T05：ELB 回源入口。固定 NodePort（iac/cce-prod/main.tf 的 elb_member 按节点 IP +
# 该端口注册后端；值与 cce-baseline.json 的 workload.node_port 一致，由校验脚本核对）。
apiVersion: v1
kind: Service
metadata:
  name: crdp-server
  namespace: crdp
  labels:
    app.kubernetes.io/name: crdp-server
    app.kubernetes.io/part-of: crdp
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: crdp-server
  ports:
    - name: http
      protocol: TCP
      port: 18080
      targetPort: 18080
      nodePort: 30080
