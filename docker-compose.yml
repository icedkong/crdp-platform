services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=256M
      # 开发/CI 关闭 binlog：应用账号（非 SUPER）创建审计只读触发器（V17/V26）时，
      # binlog 开启需要 SUPER 或 log_bin_trust_function_creators=1（MySQL 1419）。
      # 本地 / CI 无复制需求，直接关闭最简；生产由 RDS 参数组处置（运维 E22）。
      - --skip-log-bin
      # E23-T10 UAT 自查缺陷 UAT-SELF-02：与生产 RDS 参数基线对齐（iac/rds-prod/params-baseline.json
      # 的 time_zone = UTC+08:00）。审计等表的 created_at 依赖数据库默认 CURRENT_TIMESTAMP(3)，
      # 时区漂移会让「数据库 DATETIME 一律北京时间」的合同口径（AuditQuerySupport.ZONE）失真，
      # UAT M-1「当日」窗口检索落空。基线由 UatEnvTimezoneBaselineIT 锁定。
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: "DevOnly#root2026"
      MYSQL_DATABASE: crdp_platform
      MYSQL_USER: crdp_app
      MYSQL_PASSWORD: "DevOnly#app2026"
    ports:
      - "13306:3306"
    volumes:
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pDevOnly#root2026"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
