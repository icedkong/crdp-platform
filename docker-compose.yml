services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=256M
    environment:
      MYSQL_ROOT_PASSWORD: "DevOnly#root2026"
      MYSQL_DATABASE: crdp_platform
      MYSQL_USER: crdp_app
      MYSQL_PASSWORD: "DevOnly#app2026"
    ports:
      - "13306:3306"
    volumes:
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pDevOnly#root2026"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
