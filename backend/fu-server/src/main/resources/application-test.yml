fu:
  crypto:
    mode: local
    local-key: test-only-not-a-production-key
  platform:
    datasource:
      url: ${FU_PLATFORM_JDBC_URL:jdbc:mysql://127.0.0.1:13306/fu_platform?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
      username: ${FU_PLATFORM_DB_USERNAME:fu_app}
      password: "${FU_PLATFORM_DB_PASSWORD:DevOnly#app2026}"

spring:
  data:
    redis:
      host: ${FU_REDIS_HOST:127.0.0.1}
      port: ${FU_REDIS_PORT:16379}
