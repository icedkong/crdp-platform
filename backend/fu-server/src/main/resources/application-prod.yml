# 生产不提供默认口令。密钥走环境变量，不进镜像。
fu:
  crypto:
    mode: kms
  platform:
    datasource:
      url: ${FU_PLATFORM_JDBC_URL}
      username: ${FU_PLATFORM_DB_USERNAME}
      password: ${FU_PLATFORM_DB_PASSWORD}
  cors:
    allowed-origin-patterns: ${FU_CORS_ORIGINS:https://*.example.com}

spring:
  data:
    redis:
      host: ${FU_REDIS_HOST}
      port: ${FU_REDIS_PORT:6379}
