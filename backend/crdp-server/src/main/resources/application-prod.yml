# 生产不提供默认口令。密钥走环境变量，不进镜像。
crdp:
  crypto:
    mode: kms
  platform:
    datasource:
      url: ${CRDP_PLATFORM_JDBC_URL}
      username: ${CRDP_PLATFORM_DB_USERNAME}
      password: ${CRDP_PLATFORM_DB_PASSWORD}
  cors:
    allowed-origin-patterns: ${CRDP_CORS_ORIGINS:https://*.example.com}
  sms:
    # E09-T03：腾讯云短信密钥只经环境变量 / 凭据管理注入（技术方案第 4 章：DEW 凭据管理，
    # 子账号只授予发短信权限）；缺省 enabled=false，通道报 CHANNEL_DISABLED 不假装发送
    enabled: ${CRDP_SMS_ENABLED:false}
    secret-id: ${CRDP_SMS_SECRET_ID:}
    secret-key: ${CRDP_SMS_SECRET_KEY:}
    sdk-app-id: ${CRDP_SMS_SDK_APP_ID:}
    sign-name: ${CRDP_SMS_SIGN_NAME:}
  storage:
    # E10-T02 / C-NFR-003（ADR 0006）：生产走 OBS 业务桶，每次 PUT 强制 SSE-KMS；
    # AK/SK 只经环境变量注入（DEW 凭据管理，子账号只授予该桶读写权限），桶由运维建好
    # （多可用区、版本控制，E01-T08 / E22）。一个桶、每院一个 t/{租户编码}/ 对象键前缀。
    type: ${CRDP_STORAGE_TYPE:obs}
    obs:
      endpoint: ${CRDP_OBS_ENDPOINT:}
      access-key: ${CRDP_OBS_ACCESS_KEY:}
      secret-key: ${CRDP_OBS_SECRET_KEY:}
      bucket: ${CRDP_OBS_BUCKET:}
      kms-key-id: ${CRDP_OBS_KMS_KEY_ID:} # 留空走桶默认 KMS 密钥（加密本身不可关）
  file:
    download:
      # E10-T05 / tech-plan §10「下载」：下载签名链接的 HMAC 密钥（Base64，≥ 32 字节），
      # 经 DEW 凭据管理 / 环境变量注入，不进镜像；此处无默认值——缺失或过短启动即失败
      # （FileDownloadSigner fail-fast），不落到开发默认密钥上
      signing-key: ${CRDP_FILE_DOWNLOAD_SIGNING_KEY:}
  h5-upload:
    # E16-T10 / A-ATT-015、C-SCAN-008：手机扫码上传 H5 的对外基地址（https，公网可扫）。
    # 经环境变量 / 部署配置注入；缺省回落本机开发地址（二维码扫不通即暴露配置缺失）
    mobile-base-url: ${CRDP_H5_UPLOAD_MOBILE_BASE_URL:http://127.0.0.1:14175}

spring:
  data:
    redis:
      host: ${CRDP_REDIS_HOST}
      port: ${CRDP_REDIS_PORT:6379}
