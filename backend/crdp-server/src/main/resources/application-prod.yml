# 生产不提供默认口令。密钥走环境变量，不进镜像。
crdp:
  crypto:
    mode: kms
  platform:
    datasource:
      url: ${CRDP_PLATFORM_JDBC_URL}
      username: ${CRDP_PLATFORM_DB_USERNAME}
      password: ${CRDP_PLATFORM_DB_PASSWORD}
  cors:
    # E22-T10 / PT-SELF-03：无默认回落——缺 CRDP_CORS_ORIGINS 启动即失败（占位符解析不出），
    # 不落到保留域通配符（此前默认 https://*.example.com 虽无实际攻击面，但掩盖配置缺失）
    allowed-origin-patterns: ${CRDP_CORS_ORIGINS}
  sms:
    # E09-T03：腾讯云短信密钥只经环境变量 / 凭据管理注入（技术方案第 4 章：DEW 凭据管理，
    # 子账号只授予发短信权限）；缺省 enabled=false，通道报 CHANNEL_DISABLED 不假装发送
    enabled: ${CRDP_SMS_ENABLED:false}
    secret-id: ${CRDP_SMS_SECRET_ID:}
    secret-key: ${CRDP_SMS_SECRET_KEY:}
    sdk-app-id: ${CRDP_SMS_SDK_APP_ID:}
    sign-name: ${CRDP_SMS_SIGN_NAME:}
    # E22-T10 / PT-SELF-02：状态回执回调 Basic Auth（与腾讯云控制台「状态回执推送」配置一致）。
    # 都非空时公开回调强制校验（不匹配 40103）；G9（M3 审查）：通道启用而凭据缺失时生产剖面
    # 启动即失败（ProductionSafetyCheck fail fast，不只剩 IP 限流一道闸）；local / demo 保持告警
    receipt-auth-username: ${CRDP_SMS_RECEIPT_AUTH_USER:}
    receipt-auth-password: ${CRDP_SMS_RECEIPT_AUTH_PASSWORD:}
  storage:
    # E10-T02 / C-NFR-003（ADR 0006）：生产走 OBS 业务桶，每次 PUT 强制 SSE-KMS；
    # AK/SK 只经环境变量注入（DEW 凭据管理，子账号只授予该桶读写权限），桶由运维建好
    # （多可用区、版本控制，E01-T08 / E22）。一个桶、每院一个 t/{租户编码}/ 对象键前缀。
    type: ${CRDP_STORAGE_TYPE:obs}
    obs:
      endpoint: ${CRDP_OBS_ENDPOINT:}
      access-key: ${CRDP_OBS_ACCESS_KEY:}
      secret-key: ${CRDP_OBS_SECRET_KEY:}
      bucket: ${CRDP_OBS_BUCKET:}
      kms-key-id: ${CRDP_OBS_KMS_KEY_ID:} # 留空走桶默认 KMS 密钥（加密本身不可关）
  audit:
    archive:
      # S3（M3 审查）/ PLT-AUD-010、E08-T03、E22-T08：生产必须开启审计归档——
      # 在线保留 1 年、归档对象 WORM 锁定 15 年。默认 type=obs（与业务桶 CRDP_OBS_* 同一
      # 装配标准）：缺 CRDP_OBS_ARCHIVE_ENDPOINT/AK/SK/BUCKET 任一项启动即失败（fail fast，
      # 报错指明缺的配置键），不静默回落 none（none 不上传也不删在线数据，审计被改时无不可变副本）。
      # 本机 / CI（local / dev / test / demo 剖面）不激活本文件，保持 type=none 可用。
      storage:
        type: ${CRDP_AUDIT_ARCHIVE_STORAGE_TYPE:obs}
        obs:
          endpoint: ${CRDP_OBS_ARCHIVE_ENDPOINT:}
          access-key: ${CRDP_OBS_ARCHIVE_AK:}
          secret-key: ${CRDP_OBS_ARCHIVE_SK:}
          bucket: ${CRDP_OBS_ARCHIVE_BUCKET:}
  file:
    download:
      # E10-T05 / tech-plan §10「下载」：下载签名链接的 HMAC 密钥（Base64，≥ 32 字节），
      # 经 DEW 凭据管理 / 环境变量注入，不进镜像；此处无默认值——缺失或过短启动即失败
      # （FileDownloadSigner fail-fast），不落到开发默认密钥上
      signing-key: ${CRDP_FILE_DOWNLOAD_SIGNING_KEY:}
  h5-upload:
    # E16-T10 / A-ATT-015、C-SCAN-008：手机扫码上传 H5 的对外基地址（https，公网可扫）。
    # G10（M3 审查）：生产不再回落本机开发地址——缺省为空，缺失（空 / 未改回落值）由
    # ProductionSafetyCheck 启动即失败（报错指明 CRDP_H5_UPLOAD_MOBILE_BASE_URL），二维码不至扫不通才暴露
    mobile-base-url: ${CRDP_H5_UPLOAD_MOBILE_BASE_URL:}

spring:
  data:
    redis:
      host: ${CRDP_REDIS_HOST}
      port: ${CRDP_REDIS_PORT:6379}

# E22-T10 / PT-SELF-01（渗透修复自查·中危）：生产默认关闭 API 文档（swagger-ui / v3/api-docs
# 全量公开 = 接口清单与参数结构泄露，降低攻击成本）。UAT / 联调需要时显式设 CRDP_API_DOCS_ENABLED=true
# 与 CRDP_SWAGGER_ENABLED=true；本机 local / dev / test profile 不受影响（application.yml 无此关闭项）
springdoc:
  api-docs:
    enabled: ${CRDP_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${CRDP_SWAGGER_ENABLED:false}
