spring:
  application:
    name: crdp
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    default: local
  jackson:
    time-zone: Asia/Shanghai
  flyway:
    enabled: false
  data:
    redis:
      timeout: 2s

server:
  port: 18080
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html

crdp:
  security:
    session-ttl-hours: 8
    login-failure-limit: 8
    login-failure-window-seconds: 600
    # E04-T04 / PLT-AUTH-002、003：短信验证码与双因素（等保三级参数，见 platform-spec 第 7 章）
    sms-code-ttl-seconds: 300       # 验证码 5 分钟有效
    sms-resend-cooldown-seconds: 60 # 重发间隔
    sms-daily-limit-per-phone: 10   # 同一手机号每日上限
    sms-max-verify-failures: 5      # 输错 5 次作废
    two-factor-challenge-ttl-seconds: 300
    platform-two-factor-enabled: true # 平台账号强制双因素（PLT-AUTH-005）
  cors:
    allowed-origin-patterns:
      - http://127.0.0.1:*
      - http://localhost:*

info:
  app:
    name: 临床科研数据一体化平台
    description: 临床科研数据一体化平台（crdp）· M0 工程骨架
