spring:
  application:
    name: crdp
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    default: local
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      # E10-T01 / A-ATT-004：录音单个最大 50 MB，参数可覆盖上限 200 MB（平台库 V33 取值范围），
      # 这里取参数上限做兜底（超限由 MaxUploadSizeExceededException 处理器转 40001）；
      # 本院生效的更小上限（20 MB / 50 MB）在 FileUploadService 按策略校验并给出精确提示。
      max-file-size: 200MB
      max-request-size: 200MB
  flyway:
    enabled: false
  data:
    redis:
      timeout: 2s

server:
  port: 18080
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html

crdp:
  security:
    # E04-T06 / PLT-AUTH-008（等保三级参数）：空闲超时滑动续期，绝对时长到点重新登录
    session-idle-seconds: 1800         # 医院端空闲 30 分钟，租户可经 cfg_param security.session.idle-minutes 加严
    platform-session-idle-seconds: 900 # 平台端空闲 15 分钟（含租户视角会话）
    session-absolute-seconds: 43200    # 绝对会话时长 12 小时
    # E04-T05 / PLT-AUTH-006、007、010（等保三级参数，见 platform-spec 第 7 章安全参数表）
    login-failure-limit: 5            # 连续失败 5 次锁定
    login-failure-window-seconds: 600 # 锁定前计数窗口
    login-lock-seconds: 1800          # 锁定 30 分钟，管理员可提前解锁
    captcha-threshold: 3              # 连续失败 3 次触发图形验证码
    captcha-ttl-seconds: 300          # 图形验证码 5 分钟有效，一次一密
    captcha-ip-hourly-limit: 60       # 同一 IP 每小时取图上限（公开口限流）
    password-min-length: 8            # 平台下限，租户可加严（cfg_param security.password.min-length）
    password-min-categories: 3        # 大写/小写/数字/特殊字符至少 3 类
    password-history-count: 5         # 不得与最近 5 次密码相同
    password-valid-days: 90           # 密码有效期 90 天，到期强制修改
    password-expiry-remind-days: 7    # 到期前 7 天提醒
    # E04-T04 / PLT-AUTH-002、003：短信验证码与双因素（等保三级参数，见 platform-spec 第 7 章）
    sms-code-ttl-seconds: 300       # 验证码 5 分钟有效
    sms-resend-cooldown-seconds: 60 # 重发间隔
    sms-daily-limit-per-phone: 10   # 同一手机号每日上限
    sms-max-verify-failures: 5      # 输错 5 次作废
    two-factor-challenge-ttl-seconds: 300
    platform-two-factor-enabled: true # 平台账号强制双因素（PLT-AUTH-005）
  cors:
    allowed-origin-patterns:
      - http://127.0.0.1:*
      - http://localhost:*
  audit:
    archive:
      # E08-T03 / PLT-AUD-010：在线保留 1 年，归档对象 WORM 锁定 15 年（保留期只能延长）
      online-retention-months: 12
      worm-retention-years: 15
      partitions-ahead: 3 # 预建未来月分区，保证新月份写入即有分区
  sms:
    # E09-T03 / PLT-CFG-005：腾讯云短信通道（平台统一账号、签名与模板）。
    # enabled=false（默认）时发送明确失败（CHANNEL_DISABLED），不假装发送成功；生产经环境变量 / 凭据管理注入密钥
    enabled: false
    sdk-app-id: ""
    sign-name: ""
    region: ap-guangzhou
    receipt-ip-hourly-limit: 600 # 回执回调公开口按 IP 每小时限流
  storage:
    # E10-T02 / C-NFR-003（ADR 0006）：业务文件桶。local（默认，本机 / CI）为文件系统替身，
    # 目录结构与 OBS 一致（t/{租户}/…）；生产 type=obs（SSE-KMS 服务端加密，密钥经环境变量注入，
    # 见 application-prod.yml），type=obs 必填项缺失启动即失败。
    type: local
    local:
      root: data/storage # 本地桶根目录（对象按 t/{租户编码}/… 落在其下）
  file:
    # E10-T03 图片缩略图：上传图片后同步生成（保持原格式、不放大、小图复用原字节），
    # 128 = 设计稿缩略图 64×64（components.md §5/§7）的 2 倍视网膜余量（OQ-61 暂行值）。
    thumbnail:
      max-edge: 128
    preview:
      # E10-T04 / tech-plan §10「预览」：预览短时链接有效期（秒，上限 5 分钟，配置写大按 5 分钟执行）
      ttl-seconds: 300
      # 公开取流口同一 IP 每小时上限（pdf.js / audio 拉流会多次请求，取宽；AGENTS.md 第 6 节公开口限流）
      ip-hourly-limit: 600
    download:
      # E10-T05 / tech-plan §10「下载」：下载签名链接有效期（秒，上限 5 分钟，配置写大按 5 分钟执行）
      ttl-seconds: 300
      # 公开取流口同一 IP 每小时上限（浏览器断点续传 / 重试会多次请求，取宽；AGENTS.md 第 6 节公开口限流）
      ip-hourly-limit: 600
      # 链接签名密钥（Base64，解码后 ≥ 32 字节）。这里只放开发默认值（与 crdp.crypto.local-key 同口径），
      # 生产经环境变量 CRDP_FILE_DOWNLOAD_SIGNING_KEY 注入（application-prod.yml 无默认，缺省启动即失败）
      signing-key: "ZGV2LW9ubHktZmlsZS1kb3dubG9hZC1zaWduaW5nLWtleQ=="

info:
  app:
    name: 临床科研数据一体化平台
    description: 临床科研数据一体化平台（crdp）· M0 工程骨架
