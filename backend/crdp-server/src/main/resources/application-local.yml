crdp:
  security:
    # 本地用模拟短信（不外发）。平台强制双因素仍关闭，密码登录可直接进演示。
    # 需要短信验证码时打开 /dev/mock-sms 或看日志「模拟短信」。
    platform-two-factor-enabled: false
  crypto:
    # 本地 AES-256-GCM 信封加密。这把钥匙只用于虚构数据，不是生产密钥。
    # 可用环境变量 CRDP_CRYPTO_LOCAL_KEY 覆盖；留空则写入 data/demo-crypto.key。
    mode: local
    local-key: ${CRDP_CRYPTO_LOCAL_KEY:dev-only-not-a-production-key}
  sms:
    provider: mock
  demo:
    password: "Demo@2026"
    hash-marker: PENDING_DEMO_HASH
  platform:
    datasource:
      url: jdbc:mysql://127.0.0.1:13306/crdp_platform?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      username: crdp_app
      password: "DevOnly#app2026"
  tenant:
    base-domain: crdp.local # 本地子域名冒烟用：Host 带 demoa.crdp.local 即可识别租户
  provisioning:
    # 开通编排的特权连接：本地用 docker-compose 的 root（仅本机口令）；生产注入独立的迁移账号
    jdbc-url: jdbc:mysql://127.0.0.1:13306/?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "DevOnly#root2026"
    tenant-jdbc-url-template: "jdbc:mysql://127.0.0.1:13306/{db}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"

spring:
  data:
    redis:
      host: 127.0.0.1
      port: 16379

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.crdp: INFO
