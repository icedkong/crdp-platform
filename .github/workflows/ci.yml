name: ci

on:
  push:
    pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Flyway 脚本版本不重复
        run: python3 scripts/check_flyway_versions.py
      # E22-T04：RDS 生产基线 JSON 与 iac/rds-prod IaC 不漂移（参数、主备、备份、跨区域配置）
      - name: RDS 生产基线校验
        run: python3 scripts/check_rds_baseline.py
      # E22-T05：CCE 生产三级基线 JSON 与 iac/cce-prod IaC / K8s 清单 / Dockerfile 不漂移
      # （集群跨可用区、ELB TLS 套件与跳转、WAF 阻断、HSS 版本、安全组最小开放、工作负载基线）
      - name: CCE 生产基线校验
        run: python3 scripts/check_cce_baseline.py
      # E22-T08：审计归档 OBS WORM 桶基线（iac/obs-archive/worm-baseline.json）与 IaC /
      # 应用配置 / runbook 不漂移（单可用区、桶级 WORM 合规 15 年、30 天转归档、无自动删除、无异地副本）
      - name: 审计归档 WORM 基线校验
        run: python3 scripts/check_worm_baseline.py
      # E22-T09：渗透测试对接。入库工具自检（不联网，dry-run / 幂等 / 虚构数据护栏）
      # + 对接手册 / 发现清单模板 / 分级映射防漂移校验。
      - name: 渗透测试对接校验
        run: |
          python3 scripts/pentest_intake.py --selftest
          python3 scripts/check_pentest_docs.py
      # E22-T10：渗透测试高危与中危修复（后端）。修复手册 / 自查发现处置表 /
      # 生产 profile 收敛项（springdoc 双开关、CORS fail fast、回执 Basic Auth）防漂移校验。
      - name: 渗透修复（后端）校验
        run: python3 scripts/check_pentest_remediation.py
      # E22-T11：渗透测试高危与中危修复（前端）。修复手册 / 自查发现处置表 /
      # 令牌 sessionStorage 化、外链 noopener、登录回跳白名单防漂移校验。
      - name: 渗透修复（前端）校验
        run: python3 scripts/check_pentest_remediation_frontend.py
      # E23-T08 / E23-T23：医院 A / C UAT 对接。入库工具自检（不联网、dry-run /
      # 幂等 / 虚构数据护栏 / A·C 院区路由与周次校验）+ UAT 手册（A、C 两册）/
      # 发现清单模板 / 用例集计数与分级映射防漂移校验。
      - name: UAT 对接校验
        run: |
          python3 scripts/uat_intake.py --selftest
          python3 scripts/check_uat_docs.py
      # E23-T10：医院 A UAT 缺陷修复（全栈 2）。修复手册 / 自查发现处置表 /
      # V133 补授迁移与 compose MySQL 时区基线（对齐生产 RDS UTC+08:00）防漂移校验。
      - name: UAT 修复校验（全栈 2）
        run: python3 scripts/check_uat_remediation.py
      # E23-T09：医院 A UAT 缺陷修复（全栈 1）。修复手册 / 自查发现处置表 /
      # V134 补授迁移、登记即死亡代码路径与 patient.md 更正（OQ-124）防漂移校验。
      - name: UAT 修复校验（全栈 1）
        run: python3 scripts/check_uat_remediation_fullstack1.py
      # E19-T10 / E21-T30：医院 A / C UAT 支持与缺陷复测（测试）。复测工具自检
      # （不联网、dry-run / 幂等 / 关闭口径护栏 / A·C 院区路由：周次与 fix_task
      # 越院拦截、看板按周次过滤）+ 复测手册（A、C 两册）/ 复测清单模板（两份）/
      # 预演留痕防漂移校验。
      - name: UAT 复测校验（E19-T10 / E21-T30）
        run: |
          python3 scripts/uat_retest.py --selftest
          python3 scripts/check_uat_retest.py
      # E23-T05：医院样本脱敏工具自检（不联网、内置虚构样本：版面核对 / 标识替换 /
      # 一致性 / 复现 / 仓库内路径护栏 / 写后自检；V38 锚点防漂移）。
      - name: 样本脱敏工具自检
        run: python3 scripts/deidentify_sample.py --selftest
      # E21-T31：医院 C 需求澄清与验收用例评审（产品）。澄清记录 / 验收用例集 /
      # 任务覆盖核对 ↔ tasks.csv ↔ 规格 ↔ OQ-131 回写 / README 索引 / CI 接线防漂移校验。
      - name: 医院C验收用例评审校验（E21-T31）
        run: python3 scripts/check_hospital_c_acceptance_review.py
      # E02-T09：跨租户隔离与开通编排用例（*IT，按 CRDP_IT_MYSQL_PORT 门控）纳入 CI。
      # 与本地一致：docker compose 起 MySQL(13306)/Redis(16379)（含演示租户库初始化脚本），
      # 打包并短暂启动应用完成平台库与演示租户库的 Flyway 迁移与种子，再跑全量测试。
      - name: 启动 MySQL 与 Redis（与本地 docker compose 相同）
        run: docker compose up -d --wait
      - name: 打包后端
        run: mvn -B -f backend/pom.xml -pl crdp-server -am -DskipTests package
      - name: 预迁移平台库与演示租户库（启动应用至健康后停止）
        run: |
          java -jar backend/crdp-server/target/crdp-server.jar --spring.profiles.active=local &
          echo $! > /tmp/crdp.pid
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:18080/actuator/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://127.0.0.1:18080/actuator/health | grep -q '"UP"' || {
            echo "应用未健康启动，无法预迁移"; exit 1; }
          kill $(cat /tmp/crdp.pid)
          sleep 3
      - name: 格式、编译与测试（含跨租户隔离与开通编排 IT）
        run: mvn -B -f backend/pom.xml spotless:check test
        env:
          CRDP_IT_MYSQL_PORT: "13306"
      # E22-T06：单院恢复脚本。静态校验（护栏 / 五阶段 / 注册表切换）+ 在 compose MySQL 上
      # 用虚构租户 rstcheck 演练「PITR 快照 → 导出 → 导入 → 切换注册表 → 回滚」全流程。
      - name: 单院恢复脚本校验与本地演练
        run: python3 scripts/check_restore_script.py --drill
      # E22-T07：跨区域恢复演练。静态校验（护栏 / 七阶段 / RPO·RTO 实测与验收门 / 报告存档）+
      # 在 compose MySQL 上用虚构租户 xrgcheck 演练「区域不可用 → 备用区域从跨区域副本重建
      # 恢复 → 注册表切换 → 对象对齐 → 实测 RPO/RTO 报告」全流程。
      - name: 跨区域恢复演练校验与本地演练
        run: python3 scripts/check_cross_region_drill.py --drill
      # E22-T12：恢复演练测试核对。默认存档核对（演练登记表 ↔ 存档报告交叉核对、清单文档
      # 与 runbook §4 对齐、审计链镜像防漂移）+ 在 compose MySQL 上重演化身演练并按 §4 清单
      # 逐项核对恢复数据（三态标记 / 迁移历史 / 注册表 / 对象取回一致 / 审计链重算 / ShedLock /
      # 报告勾稽）；健康检查、医院端冒烟、DEW 密钥、抢锁为生产核对项，由人按清单执行。
      - name: 恢复演练核对（E22-T12）
        run: python3 scripts/drill_recovery_check.py --drill
      # E23-T11：医院 A 正式数据导入与上线切换。runbook 防漂移校验（放行闸门 / 核对口径 /
      # 回滚引用 / 转正动作）+ 核对工具自检（台账 / 只读护栏）+ 在 compose MySQL 上自验
      # （虚构终态全 PASS、四类差异逐项检出、清场归零）；生产核对由持账号运维按 runbook §5.2 执行。
      - name: 上线切换校验（E23-T11）
        run: |
          python3 scripts/golive_import_verify.py --selftest
          python3 scripts/golive_import_verify.py
          python3 scripts/golive_import_verify.py --drill
      # E23-T13：医院 A 上线后运行保障（全栈 1）。保障手册防漂移校验（SLA 时限表 / 台账列 /
      # 巡检项与阈值 / go-live §6~§7 承接互引）+ 工具自检（时限判定 / 台账校验 / 只读护栏）+
      # 在 compose MySQL 隔离库（克隆真实 schema、结束整库删除）上自验巡检：基线全 PASS、
      # 六类异常逐项检出、清场归零；台账判定（--ledger）与生产巡检（--host）由值班人执行。
      - name: 上线后运行保障校验（E23-T13）
        run: |
          python3 scripts/hypercare_verify.py --selftest
          python3 scripts/hypercare_verify.py
          python3 scripts/hypercare_verify.py --drill
      # E23-T14：医院 A 上线后运行保障（全栈 2 分担面另册）。防漂移校验（时限表与全栈 1 册
      # 双册互锁 / 共用台账列 / 分担面巡检项 HC-H1~HC-M2 与阈值 / 互引）+ 工具自检（与全栈 1
      # 工具常量一致 / 判定边界 / 只读护栏）+ 在 compose MySQL 两个隔离库（租户侧克隆 t_demoa、
      # 平台侧克隆 crdp_platform，结束整库删除）上自验分担面巡检：基线全 PASS、六类异常
      # 逐项检出、清场归零；台账判定（--ledger / --all）与生产巡检（--host）由值班人执行。
      - name: 上线后运行保障校验（E23-T14 · 全栈 2 分担面）
        run: |
          python3 scripts/hypercare_verify_fullstack2.py --selftest
          python3 scripts/hypercare_verify_fullstack2.py
          python3 scripts/hypercare_verify_fullstack2.py --drill
      # E23-T12：医院 A 上线核对与冒烟测试。冒烟手册 / GoliveSmokeIT 用例锚点（S-x）/
      # runbook §8 互引 / 索引 / CI 接线防漂移校验（机器侧冒烟 IT 随上方 mvn test 门控
      # CRDP_IT_MYSQL_PORT 运行；生产冒烟由测试按手册在场执行，W36 切换后立即）。
      - name: 上线核对与冒烟校验（E23-T12）
        run: python3 scripts/check_golive_smoke.py
      # E23-T15：医院 B 用 A 配置模板初始化。runbook 防漂移校验 + 核对工具自检
      # （表清单 ↔ ConfigTableRegistry / 只读护栏 / 差异注入判定）+ compose MySQL 演练
      # （克隆 A 配置为「B 初始化终态」→ 全注册表核对全 PASS、四类差异逐项检出、清场
      # 归零）；向导路径演练 IT（TenantBOnboardingMySqlIT）随上方 mvn test 门控运行；
      # 生产开通与一致性核对由运维按 docs/ops/hospital-b-onboarding.md 在场执行（W37）。
      - name: 医院 B 初始化校验（E23-T15）
        run: |
          python3 scripts/check_tenant_b_onboarding.py --selftest
          python3 scripts/check_tenant_b_onboarding.py
          python3 scripts/check_tenant_b_onboarding.py --drill
      # E23-T17：医院 B 验收（补录任务与节点随访率）。手册 ↔ 验收 IT（B-x 用例锚点）↔
      # runbook / OQ-128 ④ 定夺回写 / 索引 / CI 接线防漂移校验；机器侧验收 IT
      # （BAcceptanceBackfillNodeRateIT）随上方 mvn test 门控 CRDP_IT_MYSQL_PORT 运行；
      # 生产验收由测试 + 实施按 docs/testing/hospital-b-acceptance.md 在场执行（W38）。
      - name: 医院B验收校验（E23-T17）
        run: python3 scripts/check_hospital_b_acceptance.py
      # E23-T19：医院 B 上线（W38）。上线切换 runbook 防漂移校验（tasks.csv 行 /
      # 三处差异声明（无导入 · 入口复用 · 转正已随 E23-T15）/ 闸门 / 切换动作 /
      # 冒烟清单 BG-x / 回滚租户级收敛 / 互引）；机器侧锚点为引用型（五个既有 IT，
      # 不新建）；生产切换与冒烟由持账号运维 / 测试按 docs/ops/hospital-b-go-live.md
      # 在场执行（W38）。
      - name: 医院B上线校验（E23-T19）
        run: python3 scripts/check_hospital_b_golive.py
      # E23-T28：医院 B 回归（A 功能不受影响）。A 回归手册 ↔ 回归 IT（RA-x 用例锚点）↔
      # B 上线 runbook §9 衔接 / 索引 / CI 接线防漂移校验；机器侧回归 IT
      # （BRegressionAUnaffectedIT，demob 置 B 上线态后复跑 demoa A 基线）随上方
      # mvn test 门控 CRDP_IT_MYSQL_PORT 运行；生产 A 回归由测试按
      # docs/testing/hospital-b-regression-a.md 在场执行（W38，B 上线切换后立即）。
      - name: 医院B回归校验（E23-T28）
        run: python3 scripts/check_hospital_b_regression.py
      # E22-T13：等保测评资料。资料清单（制度 / 拓扑 / 安全设计 / 自查记录四类草稿 +
      # 前置材料与由人补齐项）防漂移校验：清单条目与计数一致、控制点分类齐全、
      # 自查「部分符合」行带整改口径、引用的仓库路径真实存在；盖章签署与真实 ID
      # 版由人按 W39 前补齐（OQ-133）。
      - name: 等保测评资料校验（E22-T13）
        run: python3 scripts/check_mlps_docs.py
      # E22-T14：配合测评机构现场测评（W39–W43）。入库工具自检（不联网、dry-run /
      # MLPS-ID 幂等 / 周次窗口约束 / 虚构数据护栏）+ 配合手册 / 测评问题清单模板 /
      # 分级映射与整改路由 / 索引接线防漂移校验；现场测评本身由人执行（OQ-137）。
      - name: 现场测评配合校验（E22-T14）
        run: |
          python3 scripts/mlps_onsite_intake.py --selftest
          python3 scripts/check_mlps_onsite.py
      # E22-T15：等保测评整改（后端 / 全栈 1）。D-01（上传病毒扫描，tech-plan §10）
      # 修复面与整改手册防漂移：clamd INSTREAM 适配器与 fail closed 语义、上传链路
      # 40001/50300 与 FILE_VIRUS_REJECTED 审计、followup V139 扫描列、补扫作业、
      # prod 配置字面量、自查回写与索引接线；clamd 部署与启用由运维执行（OQ-154）。
      - name: 等保测评整改校验（E22-T15）
        run: python3 scripts/check_mlps_remediation.py
      # E22-T16：等保测评整改（前端 / 全栈 2）。D-01 前端面修复与整改手册防漂移：
      # packages/api upload-rejection（40001 病毒检出 / 50300 扫描不可用分类与行级
      # 文案）、批量上传行错误与拍照队列内联原因接线、H5 原文透传、pages.md §0.2
      # 登记 50300、自查回写与索引接线；EICAR 三端呈现核验由人工执行（手册 §5）。
      - name: 等保测评整改校验（E22-T16）
        run: python3 scripts/check_mlps_remediation_frontend.py
      - name: 关闭依赖容器
        if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 安装依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: 检查格式
        working-directory: frontend
        run: pnpm format:check
      - name: 静态检查、测试与构建
        working-directory: frontend
        run: pnpm lint && pnpm test && pnpm build

  # G7（M3 审查）/ E01-T04「CI：单测、SAST、依赖与镜像扫描，高危漏洞阻断合并」：
  # ① 前端生产依赖漏洞扫描（pnpm audit --prod --audit-level high，真实阻断语义——
  #    scripts/check_frontend_audit.py 解析 JSON、HIGH/CRITICAL 退出非 0，已评估例外
  #    按公告号登记在脚本 ALLOWLIST，不靠 || true 吞掉）；
  # ② 后端镜像扫描（Trivy 扫 backend/Dockerfile 构建产物，--severity HIGH,CRITICAL
  #    --exit-code 1；ignore-unfixed：上游未发补丁的 CVE 无法靠代码改动清零，只报不阻，
  #    有补丁的高危仍阻断）。构建走 buildx + gha 层缓存，pom 未变时重复跑不重复下依赖。
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 安装依赖（audit 读锁文件与工作区）
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: 前端生产依赖漏洞扫描（高危阻断）
        run: python3 scripts/check_frontend_audit.py
      - name: 准备 buildx
        uses: docker/setup-buildx-action@v3
      - name: 构建后端镜像（gha 层缓存）
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: crdp-server:ci-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy 镜像扫描（HIGH / CRITICAL 阻断）
        run: |
          docker run --rm \
            -v /tmp/trivy-cache:/root/.cache \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/repo" \
            aquasec/trivy:0.65.0 image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /repo/.trivyignore --format table crdp-server:ci-scan
