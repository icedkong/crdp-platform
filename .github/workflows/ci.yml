name: ci

on:
  push:
    pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Flyway 脚本版本不重复
        run: python3 scripts/check_flyway_versions.py
      # E22-T04：RDS 生产基线 JSON 与 iac/rds-prod IaC 不漂移（参数、主备、备份、跨区域配置）
      - name: RDS 生产基线校验
        run: python3 scripts/check_rds_baseline.py
      # E22-T05：CCE 生产三级基线 JSON 与 iac/cce-prod IaC / K8s 清单 / Dockerfile 不漂移
      # （集群跨可用区、ELB TLS 套件与跳转、WAF 阻断、HSS 版本、安全组最小开放、工作负载基线）
      - name: CCE 生产基线校验
        run: python3 scripts/check_cce_baseline.py
      # E22-T08：审计归档 OBS WORM 桶基线（iac/obs-archive/worm-baseline.json）与 IaC /
      # 应用配置 / runbook 不漂移（单可用区、桶级 WORM 合规 15 年、30 天转归档、无自动删除、无异地副本）
      - name: 审计归档 WORM 基线校验
        run: python3 scripts/check_worm_baseline.py
      # E22-T09：渗透测试对接。入库工具自检（不联网，dry-run / 幂等 / 虚构数据护栏）
      # + 对接手册 / 发现清单模板 / 分级映射防漂移校验。
      - name: 渗透测试对接校验
        run: |
          python3 scripts/pentest_intake.py --selftest
          python3 scripts/check_pentest_docs.py
      # E22-T10：渗透测试高危与中危修复（后端）。修复手册 / 自查发现处置表 /
      # 生产 profile 收敛项（springdoc 双开关、CORS fail fast、回执 Basic Auth）防漂移校验。
      - name: 渗透修复（后端）校验
        run: python3 scripts/check_pentest_remediation.py
      # E22-T11：渗透测试高危与中危修复（前端）。修复手册 / 自查发现处置表 /
      # 令牌 sessionStorage 化、外链 noopener、登录回跳白名单防漂移校验。
      - name: 渗透修复（前端）校验
        run: python3 scripts/check_pentest_remediation_frontend.py
      # E23-T08：医院 A UAT 对接。入库工具自检（不联网、dry-run / 幂等 / 虚构数据护栏）
      # + UAT 手册 / 发现清单模板 / 用例集计数与分级映射防漂移校验。
      - name: UAT 对接校验
        run: |
          python3 scripts/uat_intake.py --selftest
          python3 scripts/check_uat_docs.py
      # E23-T10：医院 A UAT 缺陷修复（全栈 2）。修复手册 / 自查发现处置表 /
      # V133 补授迁移与 compose MySQL 时区基线（对齐生产 RDS UTC+08:00）防漂移校验。
      - name: UAT 修复校验（全栈 2）
        run: python3 scripts/check_uat_remediation.py
      # E23-T09：医院 A UAT 缺陷修复（全栈 1）。修复手册 / 自查发现处置表 /
      # V134 补授迁移、登记即死亡代码路径与 patient.md 更正（OQ-124）防漂移校验。
      - name: UAT 修复校验（全栈 1）
        run: python3 scripts/check_uat_remediation_fullstack1.py
      # E19-T10：医院 A UAT 支持与缺陷复测（测试）。复测工具自检（不联网、
      # dry-run / 幂等 / 关闭口径护栏）+ 复测手册 / 复测清单模板 / 预演留痕防漂移校验。
      - name: UAT 复测校验（E19-T10）
        run: |
          python3 scripts/uat_retest.py --selftest
          python3 scripts/check_uat_retest.py
      # E23-T05：医院样本脱敏工具自检（不联网、内置虚构样本：版面核对 / 标识替换 /
      # 一致性 / 复现 / 仓库内路径护栏 / 写后自检；V38 锚点防漂移）。
      - name: 样本脱敏工具自检
        run: python3 scripts/deidentify_sample.py --selftest
      # E02-T09：跨租户隔离与开通编排用例（*IT，按 CRDP_IT_MYSQL_PORT 门控）纳入 CI。
      # 与本地一致：docker compose 起 MySQL(13306)/Redis(16379)（含演示租户库初始化脚本），
      # 打包并短暂启动应用完成平台库与演示租户库的 Flyway 迁移与种子，再跑全量测试。
      - name: 启动 MySQL 与 Redis（与本地 docker compose 相同）
        run: docker compose up -d --wait
      - name: 打包后端
        run: mvn -B -f backend/pom.xml -pl crdp-server -am -DskipTests package
      - name: 预迁移平台库与演示租户库（启动应用至健康后停止）
        run: |
          java -jar backend/crdp-server/target/crdp-server.jar --spring.profiles.active=local &
          echo $! > /tmp/crdp.pid
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:18080/actuator/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://127.0.0.1:18080/actuator/health | grep -q '"UP"' || {
            echo "应用未健康启动，无法预迁移"; exit 1; }
          kill $(cat /tmp/crdp.pid)
          sleep 3
      - name: 格式、编译与测试（含跨租户隔离与开通编排 IT）
        run: mvn -B -f backend/pom.xml spotless:check test
        env:
          CRDP_IT_MYSQL_PORT: "13306"
      # E22-T06：单院恢复脚本。静态校验（护栏 / 五阶段 / 注册表切换）+ 在 compose MySQL 上
      # 用虚构租户 rstcheck 演练「PITR 快照 → 导出 → 导入 → 切换注册表 → 回滚」全流程。
      - name: 单院恢复脚本校验与本地演练
        run: python3 scripts/check_restore_script.py --drill
      # E22-T07：跨区域恢复演练。静态校验（护栏 / 七阶段 / RPO·RTO 实测与验收门 / 报告存档）+
      # 在 compose MySQL 上用虚构租户 xrgcheck 演练「区域不可用 → 备用区域从跨区域副本重建
      # 恢复 → 注册表切换 → 对象对齐 → 实测 RPO/RTO 报告」全流程。
      - name: 跨区域恢复演练校验与本地演练
        run: python3 scripts/check_cross_region_drill.py --drill
      # E22-T12：恢复演练测试核对。默认存档核对（演练登记表 ↔ 存档报告交叉核对、清单文档
      # 与 runbook §4 对齐、审计链镜像防漂移）+ 在 compose MySQL 上重演化身演练并按 §4 清单
      # 逐项核对恢复数据（三态标记 / 迁移历史 / 注册表 / 对象取回一致 / 审计链重算 / ShedLock /
      # 报告勾稽）；健康检查、医院端冒烟、DEW 密钥、抢锁为生产核对项，由人按清单执行。
      - name: 恢复演练核对（E22-T12）
        run: python3 scripts/drill_recovery_check.py --drill
      - name: 关闭依赖容器
        if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 安装依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: 检查格式
        working-directory: frontend
        run: pnpm format:check
      - name: 静态检查、测试与构建
        working-directory: frontend
        run: pnpm lint && pnpm test && pnpm build

  # G7（M3 审查）/ E01-T04「CI：单测、SAST、依赖与镜像扫描，高危漏洞阻断合并」：
  # ① 前端生产依赖漏洞扫描（pnpm audit --prod --audit-level high，真实阻断语义——
  #    scripts/check_frontend_audit.py 解析 JSON、HIGH/CRITICAL 退出非 0，已评估例外
  #    按公告号登记在脚本 ALLOWLIST，不靠 || true 吞掉）；
  # ② 后端镜像扫描（Trivy 扫 backend/Dockerfile 构建产物，--severity HIGH,CRITICAL
  #    --exit-code 1；ignore-unfixed：上游未发补丁的 CVE 无法靠代码改动清零，只报不阻，
  #    有补丁的高危仍阻断）。构建走 buildx + gha 层缓存，pom 未变时重复跑不重复下依赖。
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 安装依赖（audit 读锁文件与工作区）
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: 前端生产依赖漏洞扫描（高危阻断）
        run: python3 scripts/check_frontend_audit.py
      - name: 准备 buildx
        uses: docker/setup-buildx-action@v3
      - name: 构建后端镜像（gha 层缓存）
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: crdp-server:ci-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy 镜像扫描（HIGH / CRITICAL 阻断）
        run: |
          docker run --rm \
            -v /tmp/trivy-cache:/root/.cache \
            aquasec/trivy:0.65.0 image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table crdp-server:ci-scan
