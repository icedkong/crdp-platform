name: ci

on:
  push:
    pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Flyway 脚本版本不重复
        run: python3 scripts/check_flyway_versions.py
      # E22-T04：RDS 生产基线 JSON 与 iac/rds-prod IaC 不漂移（参数、主备、备份、跨区域配置）
      - name: RDS 生产基线校验
        run: python3 scripts/check_rds_baseline.py
      # E22-T05：CCE 生产三级基线 JSON 与 iac/cce-prod IaC / K8s 清单 / Dockerfile 不漂移
      # （集群跨可用区、ELB TLS 套件与跳转、WAF 阻断、HSS 版本、安全组最小开放、工作负载基线）
      - name: CCE 生产基线校验
        run: python3 scripts/check_cce_baseline.py
      # E22-T08：审计归档 OBS WORM 桶基线（iac/obs-archive/worm-baseline.json）与 IaC /
      # 应用配置 / runbook 不漂移（单可用区、桶级 WORM 合规 15 年、30 天转归档、无自动删除、无异地副本）
      - name: 审计归档 WORM 基线校验
        run: python3 scripts/check_worm_baseline.py
      # E22-T09：渗透测试对接。入库工具自检（不联网，dry-run / 幂等 / 虚构数据护栏）
      # + 对接手册 / 发现清单模板 / 分级映射防漂移校验。
      - name: 渗透测试对接校验
        run: |
          python3 scripts/pentest_intake.py --selftest
          python3 scripts/check_pentest_docs.py
      # E22-T10：渗透测试高危与中危修复（后端）。修复手册 / 自查发现处置表 /
      # 生产 profile 收敛项（springdoc 双开关、CORS fail fast、回执 Basic Auth）防漂移校验。
      - name: 渗透修复（后端）校验
        run: python3 scripts/check_pentest_remediation.py
      # E23-T08：医院 A UAT 对接。入库工具自检（不联网、dry-run / 幂等 / 虚构数据护栏）
      # + UAT 手册 / 发现清单模板 / 用例集计数与分级映射防漂移校验。
      - name: UAT 对接校验
        run: |
          python3 scripts/uat_intake.py --selftest
          python3 scripts/check_uat_docs.py
      # E23-T05：医院样本脱敏工具自检（不联网、内置虚构样本：版面核对 / 标识替换 /
      # 一致性 / 复现 / 仓库内路径护栏 / 写后自检；V38 锚点防漂移）。
      - name: 样本脱敏工具自检
        run: python3 scripts/deidentify_sample.py --selftest
      # E02-T09：跨租户隔离与开通编排用例（*IT，按 CRDP_IT_MYSQL_PORT 门控）纳入 CI。
      # 与本地一致：docker compose 起 MySQL(13306)/Redis(16379)（含演示租户库初始化脚本），
      # 打包并短暂启动应用完成平台库与演示租户库的 Flyway 迁移与种子，再跑全量测试。
      - name: 启动 MySQL 与 Redis（与本地 docker compose 相同）
        run: docker compose up -d --wait
      - name: 打包后端
        run: mvn -B -f backend/pom.xml -pl crdp-server -am -DskipTests package
      - name: 预迁移平台库与演示租户库（启动应用至健康后停止）
        run: |
          java -jar backend/crdp-server/target/crdp-server.jar --spring.profiles.active=local &
          echo $! > /tmp/crdp.pid
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:18080/actuator/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://127.0.0.1:18080/actuator/health | grep -q '"UP"' || {
            echo "应用未健康启动，无法预迁移"; exit 1; }
          kill $(cat /tmp/crdp.pid)
          sleep 3
      - name: 格式、编译与测试（含跨租户隔离与开通编排 IT）
        run: mvn -B -f backend/pom.xml spotless:check test
        env:
          CRDP_IT_MYSQL_PORT: "13306"
      # E22-T06：单院恢复脚本。静态校验（护栏 / 五阶段 / 注册表切换）+ 在 compose MySQL 上
      # 用虚构租户 rstcheck 演练「PITR 快照 → 导出 → 导入 → 切换注册表 → 回滚」全流程。
      - name: 单院恢复脚本校验与本地演练
        run: python3 scripts/check_restore_script.py --drill
      - name: 关闭依赖容器
        if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 安装依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: 检查格式
        working-directory: frontend
        run: pnpm format:check
      - name: 静态检查、测试与构建
        working-directory: frontend
        run: pnpm lint && pnpm test && pnpm build
